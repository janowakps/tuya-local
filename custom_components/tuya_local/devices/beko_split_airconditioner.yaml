name: Air conditioner
products:
  - id: bhqwzcsvi7kh6luf
    manufacturer: Beko
    model: BEHPGH 090
entities:
  - entity: climate
    dps:
      - id: 1
        name: hvac_mode
        type: boolean
        mapping:
          - dps_val: false
            value: "off"
          - dps_val: true
            constraint: mode
            conditions:
              - dps_val: auto
                value: heat_cool
              - dps_val: cold
                value: cool
              - dps_val: wind
                value: fan_only
              - dps_val: dry
                value: dry
              - dps_val: wet
                value: dry
              - dps_val: hot
                value: heat
      - id: 2
        name: temperature
        type: integer
        unit: C
        range:
          min: 16
          max: 31
      - id: 3
        name: current_temperature
        type: integer
      - id: 4
        name: mode
        type: string
        hidden: true
      - id: 5
        name: fan_mode
        type: string
        mapping:
          - dps_val: auto
            value: auto
          - dps_val: low
            value: low
          - dps_val: high
            value: high
          - dps_val: strong
            value: strong
      - id: 8
        name: preset_mode
        type: boolean
        optional: true
        mapping:
          - dps_val: true
            value: eco
          - dps_val: false
            value: comfort
          - dps_val: null
            value: comfort
            hidden: true
      - id: 19
        name: temperature_unit
        type: string
        optional: true
        mapping:
          - dps_val: c
            value: C
          - dps_val: f
            value: F
      - id: 101
        name: anti_frost
        type: boolean
        optional: true
  - entity: switch
    translation_key: power
    category: config
    dps:
      - id: 1
        name: switch
        type: boolean
  - entity: select
    translation_key: fan_mode
    category: config
    dps:
      - id: 5
        name: option
        type: string
        mapping:
          - dps_val: auto
            value: auto
          - dps_val: low
            value: low
          - dps_val: high
            value: high
          - dps_val: strong
            value: strong
  - entity: switch
    translation_key: anti_frost
    category: config
    dps:
      - id: 101
        name: switch
        type: boolean
  - entity: select
    translation_key: temperature_unit
    category: config
    dps:
      - id: 19
        type: string
        name: option
        mapping:
          - dps_val: c
            value: celsius
          - dps_val: f
            value: fahrenheit
  - entity: binary_sensor
    class: problem
    category: diagnostic
    dps:
      - id: 22
        type: bitfield
        name: sensor
        mapping:
          - dps_val: 0
            value: false
          - value: true
      - id: 22
        name: fault_code
        type: bitfield
